<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bingo</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #38bdf8;
    --marked: #38bdf8;
    --free: #fbbf24;
    --text: #e2e8f0;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .muted { color: var(--muted); }

  #screen-join { max-width: 380px; margin: 60px auto; }
  input {
    width: 100%; padding: 10px 12px; margin: 6px 0 16px;
    border-radius: 8px; border: 1px solid #334155;
    background: #0b1220; color: var(--text); font-size: 1rem;
  }
  button {
    padding: 10px 16px; border-radius: 8px; border: none;
    background: var(--accent); color: #05202e; font-weight: 600;
    cursor: pointer; font-size: 0.95rem;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: #334155; color: var(--text); }

  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }

  #screen-game { display: none; }
  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
  }
  .code-badge {
    background: var(--panel); padding: 6px 14px; border-radius: 8px;
    font-weight: 700; letter-spacing: 2px; font-size: 1.1rem;
  }

  .layout { display: flex; gap: 24px; flex-wrap: wrap; }
  .card-col { flex: 1 1 340px; }
  .side-col { flex: 1 1 260px; }

  .bingo-grid {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px;
    max-width: 380px; margin-bottom: 8px;
  }
  .header-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 380px; }
  .header-cell {
    text-align: center; font-weight: 700; color: var(--accent);
    padding-bottom: 4px; font-size: 1.1rem;
  }
  .cell {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    background: var(--panel); border-radius: 8px; font-size: 1.1rem; font-weight: 600;
    border: 2px solid transparent;
  }
  .cell.marked { background: var(--marked); color: #05202e; }
  .cell.free { background: var(--free); color: #3a2a00; }

  .panel {
    background: var(--panel); border-radius: 10px; padding: 14px; margin-bottom: 14px;
  }
  .players li, #callHistory span {
    display: inline-block;
  }
  .players { list-style: none; padding: 0; margin: 0; }
  .players li { padding: 4px 0; }
  .host-tag { font-size: 0.75rem; color: var(--free); margin-left: 6px; }

  #lastCalled {
    font-size: 2.4rem; font-weight: 800; text-align: center;
    color: var(--accent); margin: 8px 0;
  }
  #callHistory {
    display: flex; flex-wrap: wrap; gap: 6px; max-height: 140px; overflow-y: auto;
  }
  #callHistory span {
    background: #0b1220; padding: 3px 8px; border-radius: 6px; font-size: 0.85rem;
  }

  #toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: #05202e; padding: 10px 18px;
    border-radius: 8px; font-weight: 700; display: none; z-index: 10;
  }
</style>
</head>
<body>

<div id="toast"></div>

<div class="wrap">

  <div id="screen-join">
    <h1>🎱 Bingo</h1>
    <p class="muted">Create a room or join one with a code.</p>
    <input id="nameInput" placeholder="Your name" maxlength="20">
    <div class="row" style="margin-bottom: 16px;">
      <button id="createBtn">Create Room</button>
    </div>
    <p class="muted" style="text-align:center; margin: 4px 0;">— or —</p>
    <input id="codeInput" placeholder="Room code" maxlength="5" style="text-transform:uppercase;">
    <button id="joinBtn" class="secondary" style="width:100%;">Join Room</button>
    <p id="joinError" style="color:#f87171;"></p>
  </div>

  <div id="screen-game">
    <div class="top-bar">
      <div>
        <span class="code-badge" id="roomCodeDisplay"></span>
        <span class="muted" id="statusDisplay"></span>
      </div>
      <div id="hostControls" style="display:none;">
        <button id="startBtn">Start Game</button>
        <button id="callBtn" style="display:none;">Call Next Number</button>
      </div>
    </div>

    <div class="layout">
      <div class="card-col">
        <div class="header-row">
          <div class="header-cell">B</div>
          <div class="header-cell">I</div>
          <div class="header-cell">N</div>
          <div class="header-cell">G</div>
          <div class="header-cell">O</div>
        </div>
        <div class="bingo-grid" id="grid"></div>
        <button id="bingoBtn" style="width:100%; margin-top:10px;" disabled>Call BINGO!</button>
      </div>

      <div class="side-col">
        <div class="panel">
          <div class="muted" style="font-size:0.85rem;">Last called</div>
          <div id="lastCalled">—</div>
        </div>
        <div class="panel">
          <div class="muted" style="font-size:0.85rem; margin-bottom:6px;">All called numbers</div>
          <div id="callHistory"></div>
        </div>
        <div class="panel">
          <div class="muted" style="font-size:0.85rem; margin-bottom:6px;">Players</div>
          <ul class="players" id="playerList"></ul>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
