<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bingo</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="toast"></div>

<main class="container">

  <!-- ========================================================= -->
  <!-- JOIN SCREEN -->
  <!-- ========================================================= -->

  <section id="screen-join" class="screen">

    <div class="card-panel">

      <h1>🎱 Bingo</h1>

      <p class="muted">
        Create a room or join an existing room.
      </p>

      <label for="nameInput">
        Your name
      </label>

      <input
        id="nameInput"
        type="text"
        maxlength="20"
        placeholder="Enter your name"
        autocomplete="off"
      >

      <button id="createBtn">
        Create Room
      </button>

      <div class="divider">
        OR
      </div>

      <label for="codeInput">
        Room code
      </label>

      <input
        id="codeInput"
        type="text"
        maxlength="5"
        placeholder="ABCDE"
        autocomplete="off"
        style="text-transform: uppercase;"
      >

      <button id="joinBtn" class="secondary">
        Join Room
      </button>

      <p id="joinError" class="error"></p>

    </div>

  </section>


  <!-- ========================================================= -->
  <!-- GAME SCREEN -->
  <!-- ========================================================= -->

  <section id="screen-game" class="screen hidden">

    <!-- Header -->

    <header class="top-bar">

      <div>

        <div class="room-code">
          <span>ROOM</span>
          <strong id="roomCodeDisplay">-----</strong>
        </div>

        <div
          id="statusDisplay"
          class="status"
        >
          Waiting...
        </div>

      </div>

      <div id="hostControls">

        <button
          id="readyBtn"
          class="secondary"
        >
          Ready
        </button>

        <button
          id="startBtn"
          class="hidden"
        >
          Start Game
        </button>

      </div>

    </header>


    <!-- ======================================================= -->
    <!-- WAITING AREA -->
    <!-- ======================================================= -->

    <section
      id="waitingArea"
      class="waiting-area"
    >

      <div class="panel">

        <h2>Prepare Your Card</h2>

        <p class="muted">
          Your card is private.
          Arrange/check your card and mark yourself ready.
        </p>

        <p id="readyStatus"></p>

      </div>

    </section>


    <!-- ======================================================= -->
    <!-- GAME AREA -->
    <!-- ======================================================= -->

    <section id="gameArea" class="hidden">

      <div class="layout">

        <!-- CARD -->

        <div class="card-section">

          <div class="bingo-header">
            <div>B</div>
            <div>I</div>
            <div>N</div>
            <div>G</div>
            <div>O</div>
          </div>

          <div
            id="grid"
            class="bingo-grid"
          ></div>

        </div>


        <!-- SIDE PANEL -->

        <aside class="side-section">

          <div class="panel">

            <div class="panel-title">
              Room
            </div>

            <div
              id="roomStatus"
              class="large-status"
            >
              Waiting
            </div>

          </div>


          <div class="panel">

            <div class="panel-title">
              Players
            </div>

            <ul
              id="playerList"
              class="players"
            ></ul>

          </div>

        </aside>

      </div>

    </section>

  </section>

</main>

<script src="app.js"></script>

</body>
</html>
